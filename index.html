<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medium – Where good ideas find you.</title>
  <style>
    /* Reset and Base Styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg-color: #f7f4ed; /* Warm off-white background matching Medium */
  --text-dark: #242424;
  --border-color: #191919;
  --green-btn: #1a8917;
}

body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-dark);
  line-height: 1.4;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Helper Utilities */
.desktop-only {
  display: inline-block;
}

/* Navbar */
.navbar {
  border-bottom: 1px solid var(--border-color);
  padding: 18px 24px;
}

.nav-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-family: 'Newsreader', Georgia, serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--text-dark);
  text-decoration: none;
  letter-spacing: -1px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 24px;
}

.nav-item {
  color: var(--text-dark);
  text-decoration: none;
  font-size: 14px;
}

.nav-item:hover {
  color: #000;
}

/* Buttons */
.btn {
  display: inline-block;
  text-decoration: none;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  transition: background-color 0.2s ease;
}

.btn-black {
  background-color: var(--text-dark);
  color: #ffffff;
  padding: 8px 16px;
}

.btn-black:hover {
  background-color: #000000;
}

.btn-hero {
  background-color: var(--text-dark);
  color: #ffffff;
  padding: 10px 36px;
  font-size: 18px;
  border-radius: 25px;
}

/* Hero Section */
.hero-section {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 60px 24px;
  border-bottom: 1px solid var(--border-color);
  overflow: hidden;
}

.hero-container {
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 40px;
}

.hero-content {
  max-width: 550px;
  flex: 1;
}

.hero-title {
  font-family: 'Newsreader', Times New Roman, serif;
  font-size: 106px;
  line-height: 0.95;
  font-weight: 400;
  letter-spacing: -4px;
  margin-bottom: 32px;
}

.hero-subtitle {
  font-size: 24px;
  color: var(--text-dark);
  margin-bottom: 48px;
  font-weight: 400;
  max-width: 440px;
}

/* Hero Right Illustration Styling */
.hero-image {
  flex: 1;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  max-width: 500px;
}

.hero-illustration {
  width: 100%;
  max-width: 460px;
  height: auto;
  object-fit: contain;
  mix-blend-mode: multiply; /* Blends white/transparent image borders right into the background */
}

/* Footer Section */
.footer {
  padding: 20px 24px;
  background-color: var(--bg-color);
}

.footer-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: center;
}

.footer-container a {
  color: #6b6b6b;
  text-decoration: none;
  font-size: 13px;
}

.footer-container a:hover {
  color: var(--text-dark);
}

/* Responsive Design (Mobile adjustments) */
@media (max-width: 768px) {
  .desktop-only {
    display: none !important;
  }

  .navbar {
    padding: 12px 16px;
  }

  .hero-section {
    padding: 40px 20px 60px 20px;
    align-items: flex-start;
  }

  .hero-title {
    font-size: 72px;
    letter-spacing: -2px;
    margin-bottom: 24px;
  }

  .hero-subtitle {
    font-size: 20px;
    margin-bottom: 36px;
  }

  .btn-hero {
    background-color: var(--green-btn);
    width: 100%;
    padding: 14px 0;
    font-size: 18px;
  }

  .footer-container {
    justify-content: flex-start;
    gap: 20px;
  }
}

  </style>
  
  <!-- Google Fonts for Serif Heading and Sans-Serif Body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="logo">Medium</a>
      
      <nav class="nav-links">
        <a href="#" class="nav-item desktop-only">Our story</a>
        <a href="#" class="nav-item desktop-only">Membership</a>
        <a href="#" class="nav-item desktop-only">Write</a>
        <a href="#" class="nav-item desktop-only">Sign in</a>
        <a href="#" class="btn btn-black">Get started</a>
      </nav>
    </div>
  </header>

  <!-- Hero Main Section -->
  <main class="hero-section">
    <div class="hero-container">
      <div class="hero-content">
        <h1 class="hero-title">Human<br>stories &amp; ideas</h1>
        <p class="hero-subtitle">A place to read, write, and deepen your understanding</p>
        <a href="#" class="btn btn-hero">Start reading</a>
      </div>

      <!-- Right Graphic/Illustration Container -->
      <div class="hero-image desktop-only">
        <img src="flower.png" alt="Medium Illustration" class="hero-illustration">
      </div>
      
    </div>
  </main>

  <!-- Footer Section -->
  <footer class="footer">
    <div class="footer-container">
      <a href="#">Help</a>
      <a href="#" class="desktop-only">Status</a>
      <a href="#">About</a>
      <a href="#" class="desktop-only">Careers</a>
      <a href="#" class="desktop-only">Press</a>
      <a href="#" class="desktop-only">Blog</a>
      <a href="#" class="desktop-only">Store</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#" class="desktop-only">Rules</a>
      <a href="#" class="desktop-only">Text to speech</a>
    </div>
  </footer>

</body>
</html>
